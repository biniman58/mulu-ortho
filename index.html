<style>
/* Layout: one calm column (max 560px) like a phone app; hero → quick chips → featured implants → numbered sections → help; bottom tab bar */
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --ink:#18282A; --muted:#5F6E6D; --line:#E2E0DA;
  --teal:#2F5D5B; --teal-ink:#FFFFFF; --teal-soft:#E3ECEA; --sand:#EAE5DB;
  --ok:#2E7D4F; --warn:#B26A00; --off:#9A4040;
  --f-display:"Fraunces",Georgia,"Noto Sans Ethiopic",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI","Noto Sans Ethiopic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-eth:"Noto Sans Ethiopic","Nyala",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101A1A; --surface:#172424; --ink:#E7EFEE; --muted:#97A8A6; --line:#263636;
  --teal:#6FB3AC; --teal-ink:#0B1F1D; --teal-soft:#1D3533; --sand:#1E2B2A;
  --ok:#67CF92; --warn:#F2AE4E; --off:#E79393; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:11px;padding-block:11px}
.mono{width:40px;height:40px;flex:none;display:block;border-radius:10px}
.brand{line-height:1.1;min-width:0}
.brand b{display:block;font:700 22px/1 Poppins,var(--f-body);color:#03393E;letter-spacing:-.01em}
@media (max-width:440px){.langbtn{padding:6px 8px;font-size:12px}.mono{width:34px;height:34px}}
.brand small{display:block;font:600 12px/1 Poppins,var(--f-body);letter-spacing:.3em;margin-right:-.3em;color:var(--ink,#1F2A37);margin-top:5px}
.langbtn{margin-left:auto;flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 11px;font-weight:700;font-size:13px;cursor:pointer;color:var(--teal)}
.orderbtn{margin-left:8px;white-space:nowrap;flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 8px 7px 13px;font-weight:600;font-size:14px;cursor:pointer}
.orderbtn .n{min-width:24px;height:24px;border-radius:999px;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font:500 12px var(--f-mono)}

/* hero */
.hero{padding-block:26px 8px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.hero h1{font:700 clamp(34px,9vw,46px)/1.02 var(--f-display);letter-spacing:-.02em;margin:12px 0 10px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero p{margin:0 0 18px;color:var(--muted);max-width:42ch}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:0 1px 0 var(--line)}
.search:focus-within{border-color:var(--teal)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px var(--f-body);padding:14px 0;outline:none}
.search svg{color:var(--muted);flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* featured */
.label{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 0 12px}
.label h2{margin:0;font:700 21px var(--f-display)}
.label a,.label button.link{color:var(--teal);font-weight:600;font-size:14px;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.rowscroll{display:grid;grid-auto-flow:column;grid-auto-columns:min(62%,220px);gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;scroll-snap-type:x mandatory}
.rowscroll::-webkit-scrollbar{display:none}
.feat{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.feat .txt{padding:10px 12px 12px}
.feat b{display:block;font-size:14.5px;line-height:1.3}
.feat small{color:var(--muted);font-size:12.5px}

/* product picture */
.pic{position:relative;aspect-ratio:4/3;background:var(--sand);display:grid;place-items:center;overflow:hidden;max-width:100%}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff;padding:6px}
.pic svg{width:72%;height:72%;color:var(--teal)}
.pic .brandtag{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--muted);border-radius:6px;padding:2px 7px;font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase}

/* numbered sections */
.sections{display:grid;border-top:1px solid var(--line);margin-top:30px}
.sec{border-bottom:1px solid var(--line)}
.sec>button{width:100%;display:grid;grid-template-columns:44px 1fr 28px;align-items:center;gap:6px;background:none;border:0;padding:20px 0;cursor:pointer;text-align:left}
.sec .no{font:500 13px var(--f-mono);color:var(--teal)}
.sec h3{margin:0;font:700 24px/1.1 var(--f-display)}
.sec .sub{display:block;color:var(--muted);font-size:13.5px;margin-top:4px;font-family:var(--f-body);font-weight:500}
.sec .plus{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;transition:transform .2s}
.sec[open] .plus{transform:rotate(45deg);background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.sec .body{padding:0 0 20px 50px;display:grid;gap:8px}
.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.tile .ic{width:40px;height:40px;border-radius:10px;background:var(--teal-soft);display:grid;place-items:center;flex:none}
.tile .ic svg{width:28px;height:28px;color:var(--teal)}
.tile .ic img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.tile .ic{overflow:hidden}
.tile b{display:block;font-size:14.5px}
.tile small{color:var(--muted);font-size:12.5px}
.tile .go{margin-left:auto;color:var(--muted)}

/* help */
.help{margin:32px 0 10px;background:var(--teal);color:var(--teal-ink);border-radius:20px;padding:22px 20px}
.help h2{margin:0 0 4px;font:700 23px/1.15 var(--f-display)}
.help p{margin:0 0 16px;opacity:.85;font-size:14px}
.help .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.help .btns a,.help span.btn{display:flex;flex-direction:column;align-items:center;gap:5px;background:color-mix(in srgb,var(--teal-ink) 14%,transparent);color:inherit;text-decoration:none;border-radius:12px;padding:12px 6px;font-weight:600;font-size:13.5px}
.help .num{margin-top:14px;font-size:13px;opacity:.85}
.help .num b{user-select:all}

/* browse / lists */
.viewhead{padding-block:14px 4px}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:8px 14px 8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.back svg{width:18px;height:18px}
.homelink{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none;min-width:0}
.brand b,.brand small{display:block}
.viewhead h1{margin:0;font:700 30px/1.1 var(--f-display)}
.viewhead p{margin:4px 0 0;color:var(--muted)}
.stickytools{position:sticky;top:61px;z-index:10;background:var(--bg);padding-block:12px 4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:6px}
@media (min-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .txt{padding:10px 12px 0;display:grid;gap:3px;flex:1}
.card h4{margin:0;font-size:14px;line-height:1.3}
.card .meta{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.sku{font:500 11px var(--f-mono)}
.stock{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:11.5px}
.stock::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.stock.in{color:var(--ok)}.stock.low{color:var(--warn)}.stock.order{color:var(--off)}
.card .act{display:flex;gap:6px;padding:10px 12px 12px}
.card .act .add{flex:1}
.fav{width:38px;border:1px solid var(--line);background:transparent;border-radius:10px;cursor:pointer;color:var(--muted);font-size:16px}
.fav[aria-pressed="true"]{color:#C2453D;border-color:color-mix(in srgb,#C2453D 40%,var(--line))}
.add{border:0;background:var(--teal);color:var(--teal-ink);border-radius:10px;padding:9px 10px;font-weight:700;font-size:13.5px;cursor:pointer}
.add.ghost{background:var(--teal-soft);color:var(--teal)}
.empty{color:var(--muted);text-align:center;padding:36px 8px}
.packs{display:grid;gap:12px;padding-top:10px}
.pack{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.pack h4{margin:0;font:700 19px var(--f-display)}
.pack ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:2px}
.pack .row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--teal)}
main{padding-bottom:110px}
footer{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;padding-block:18px 100px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(0 0 0/.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{padding-block:18px 0;display:grid;gap:14px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{margin:0;font:700 24px var(--f-display)}
.x{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px;font-weight:600;cursor:pointer}
.detail .pic{border-radius:14px}
.field{display:grid;gap:5px;min-width:0}
.field>label,.field>span{font:700 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.qtyrow{display:flex;gap:10px;align-items:end}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.qty button{width:42px;height:44px;border:0;background:transparent;font-size:19px;font-weight:600;cursor:pointer}
.qty output{min-width:34px;text-align:center;font:500 15px var(--f-mono)}
.primary{border:0;border-radius:12px;background:var(--teal);color:var(--teal-ink);padding:15px;font-weight:700;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.secondary{border:1px solid var(--line);border-radius:12px;background:transparent;padding:13px;font-weight:700;font-size:15px;cursor:pointer;text-align:center;text-decoration:none;display:block;color:var(--ink)}
.lines{display:grid;border:1px solid var(--line);border-radius:12px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.line:first-child{border-top:0}
.line small{display:block;color:var(--muted)}
.line .q{font:500 14px var(--f-mono);text-align:right}
.line .q small{display:block;font-size:11px}
.total{margin:0;font-size:15px;text-align:right}
.incl{margin-top:-6px}
.line button{border:0;background:none;color:var(--off);font-weight:600;font-size:13px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
.seg input{accent-color:var(--teal)}
.field input[type=radio],.field input[type=checkbox]{width:auto;min-width:0;padding:0;border:0;border-radius:50%;background:none;margin:0;flex:none;-webkit-appearance:radio;appearance:auto;height:18px;width:18px}
.note{margin:0;color:var(--muted);font-size:13px}
.err{margin:0;color:var(--off);font-size:13px}
.receipt{margin:0;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px;font:500 13px/1.55 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Most requested: swipe row on phones, compact picture strip on computers */
.mrbtn{all:unset;display:block;cursor:default}
.mrbtn .sub,.mrbtn .plus{display:none}
@media (min-width:760px){
  .mr{width:min(1240px,calc(100vw - 48px));margin-left:50%;transform:translateX(-50%)}
  .mr .rowscroll{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible}
  .mr .feat .pic{aspect-ratio:1/1}
  .mr .feat .txt{padding:8px 10px 10px}
  .mr .feat b{font-size:13.5px}
}
.mrbtn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.seg label{white-space:nowrap}
.dtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dtop .price{font:700 22px var(--f-display)}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.avail{margin:0;font-weight:600;font-size:14px}
.avail.in{color:var(--ok)}.avail.low{color:var(--warn)}.avail.order{color:var(--off)}
.qtyrow{align-items:end}
.dsec{border-top:1px solid var(--line);padding-top:10px}
.dsec summary{cursor:pointer;font-weight:700;font-size:14px;padding:4px 0}
.dsec ul{margin:8px 0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.sizegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:8px}
.sizegrid span{display:grid;gap:1px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600}
.sizegrid b{font-size:13px;color:var(--ink)}
.sizegrid .in{color:var(--ok)}.sizegrid .low{color:var(--warn)}.sizegrid .order{color:var(--off)}

.buy{display:grid;gap:6px}
.buy label{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px}
.buy label.on{border-color:var(--teal);background:var(--teal-soft)}
.buy input{accent-color:var(--teal);margin:0}
.buy small{font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.buy label.on small{color:var(--teal)}
@media (min-width:760px) and (max-width:1199px){.mr{width:min(760px,calc(100vw - 48px))}}
@media (min-width:1200px){.mr .rowscroll{grid-template-columns:repeat(8,minmax(0,1fr))}}
.feat b{overflow-wrap:anywhere;hyphens:auto}

/* Stronger actions: deeper teal for add/continue, WhatsApp green for the final send, filled order button once items are in */
:root{--act:#1E4B49;--act-hover:#163A38;--wa:#1A8D4A;--wa-hover:#147A3E}
.add,.primary{background:var(--act)!important;color:#fff!important;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.add:hover,.primary:hover{background:var(--act-hover)!important}
.primary.wa{background:var(--wa)!important;display:flex;align-items:center;justify-content:center;gap:10px}
button.primary{width:100%}
.primary.wa:hover{background:var(--wa-hover)!important}
.primary.wa svg{width:22px;height:22px}
.orderbtn{background:var(--act)!important;color:#fff!important;border-color:var(--act)!important}
.orderbtn .n{background:#E8C690!important;color:#1F2A37!important}
@media (prefers-color-scheme:dark){.brand b{color:var(--teal)!important}:root{--act:#3E8C86;--act-hover:#4A9C95;--wa:#1E9E52;--wa-hover:#23B05C}}


.price.ask{font:600 15px var(--f-body);color:var(--muted)}
.branches{display:grid;gap:8px;margin-top:10px}
.branch{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--teal-ink) 14%,transparent);color:inherit;text-decoration:none;border-radius:12px;padding:11px 14px}
.branch span{flex:1;min-width:0}.branch b{display:block;font-size:14.5px}.branch small{display:block;font-size:12.5px;opacity:.8}
.branch svg{flex:none}
.branch .ph{font-weight:600;opacity:.95;user-select:all}
.help .branch{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:start;padding:12px 14px}
.help .branch svg{margin-top:2px}
.bact{grid-column:2;display:flex;gap:8px;margin-top:9px}
.help .branch a.bl{display:inline-flex;padding:7px 14px;font-size:13px;font-weight:700;border-radius:10px;color:inherit;text-decoration:none;background:color-mix(in srgb,var(--teal-ink) 18%,transparent)}
/* Install-the-app banner */
.install{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0 4px}
.install svg{width:40px;height:40px;flex:none}

const dimOf=(d,k)=>d.dims.find(x=>x.k===k);
function partEtb(x,v,mat){ if(x.priceOvr&&x._d){ const k=partKey(x._d,x,v,mat); if(x.priceOvr[k]) return x.priceOvr[k]; } if(x.etb) return x.etb(v,mat); return etb(x.usd(v,mat)); }
function partKey(d,part,v,mat){ const ks=part.dims.map(k=>dimOf(d,k)).filter(x=>!x.when||x.when(v)).map(x=>v[x.k]); return (part.matStock?[part.stockMat?part.stockMat(mat):mat,...ks]:ks).join(" / "); }
function partStock(d,part,v,mat){ return part.stock[partKey(d,part,v,mat)]||0; }
const partCount=(x,v)=>x.count?x.count(v):1;
function partsFor(d,v,mat){ return d.parts.filter(x=>!x.when||x.when(v,mat)); }
function setEtb(d,v,mat){ const fixed=d.setEtb?d.setEtb(v,mat):null; if(fixed) return fixed; const a=partsFor(d,v,mat).map(x=>{const e=partEtb(x,v,mat); return e==null?null:e*partCount(x,v);}); return a.some(z=>z==null)?null:a.reduce((s,z)=>s+z,0); }

function openItem(sku){

  const v={}; d.dims.forEach(x=>v[x.k]=x.o[0]); let mat=d.material[0]||""; let buy="set";

  [...partsFor(d,v,mat)].reverse().forEach(part=>{ const best=Object.entries(part.stock).filter(([k])=>!part.matStock||k.startsWith((part.stockMat?part.stockMat(mat):mat)+" / ")).filter(([k])=>!d.firstType||k.startsWith(d.dims[0].o[0]+" / ")).sort((x,y)=>y[1]-x[1])[0]; if(!best) return; let vals=best[0].split(" / "); if(part.matStock) vals=vals.slice(1);
    const ds=part.dims.map(k=>dimOf(d,k)); let i=0; ds.forEach(x=>{ if(x.when&&vals.length<=ds.filter(y=>!y.when).length) return; if(vals[i]!=null) v[x.k]=vals[i]; i++; }); });
  const sync=()=>{
    if(v.Cup&&dimOf(d,"Head")&&sku==="J-202"){ const c=parseInt(v.Cup); v.Head=c>=52?"36 mm":c>=48?"32 mm":"28 mm"; }

/* ================= LIVE STOCK FROM GOOGLE SHEET =================
   Columns: Code | Category | Product | Part | Part ID | Option | Stock | Price ETB
   Stock and price edits in the sheet show here without re-uploading the site. */
function parseCSV(t){ const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cell); cell=""; } else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; } else if(c!=='\r') cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); } return rows; }
function applySheet(rows){
  const head=rows[0].map(h=>h.trim().toLowerCase()); const ix=n=>head.indexOf(n);
  const iC=ix("code"),iP=ix("part id"),iO=ix("option"),iS=ix("stock"),iPr=ix("price etb"); if(iC<0||iS<0) return 0;
  let n=0; const touched=new Set();
  for(const r of rows.slice(1)){
    const code=(r[iC]||"").trim(); if(!code) continue; const qty=parseInt(r[iS],10); const price=parseInt(String(r[iPr]||"").replace(/[^0-9]/g,""),10);
    const d=DETAIL[code], p=byId(code); if(!p) continue;
    const pid=(r[iP]||"").trim();
    if(!d||pid==="—"||!pid){ if(!isNaN(qty)) p.qty=qty; if(price) p.priceEtb=price; p.stock=p.qty===0?"order":p.qty<=3?"low":"in"; n++; continue; }
    const part=d.parts.find(x=>x.id===pid); if(!part) continue; const key=(r[iO]||"").trim();
    if(!isNaN(qty)) part.stock[key]=qty; if(price){ (part.priceOvr=part.priceOvr||{})[key]=price; }
    touched.add(code); n++;
  }
  touched.forEach(code=>{ const d=DETAIL[code], p=byId(code); p.qty=Object.values(d.parts[0].stock).reduce((a,b)=>a+b,0); p.stock=p.qty===0?"order":p.qty<=3?"low":"in"; });
  return n;
}
async function loadSheet(){
  if(!PHARMACY.stockSheetCsv) return;
  try{
    const res=await fetch(PHARMACY.stockSheetCsv+(PHARMACY.stockSheetCsv.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const n=applySheet(parseCSV(await res.text()));
    if(n){ LIVE=new Date(); if($("#sheet").hidden) VIEWS[view](); }
  }catch(e){ console.warn("Stock sheet not loaded, showing built-in stock",e); }
}

function trText(s){ const k=s.trim(); if(!k) return s; let r=AM[k]; if(r==null){ for(const [re,rep] of AM_RE){ if(re.test(k)){ r=k.replace(re,rep); break; } } } return r==null?s:s.replace(k,r); }
function translate(root){
  if(LANG!=="am"||!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&/^(SCRIPT|STYLE|PRE|TEXTAREA)$/.test(n.parentElement.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ const o=n.nodeValue, t=trText(o); if(t!==o){ const el=n.parentElement; if(el&&el.tagName==="OPTION"&&!el.hasAttribute("value")) el.setAttribute("value",o.trim()); n.nodeValue=t; } });
  (root.querySelectorAll?root.querySelectorAll("[placeholder],[aria-label]"):[]).forEach(el=>["placeholder","aria-label"].forEach(a=>{ const v=el.getAttribute(a); if(v){ const t=trText(v); if(t!==v) el.setAttribute(a,t); } }));
}
